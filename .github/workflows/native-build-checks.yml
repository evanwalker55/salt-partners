name: Native build checks

on:
  push:
    branches: [codex/partner-launch-readiness]
    paths:
      - .github/workflows/native-build-checks.yml
      - android/**
      - ios/**
      - public/**
      - scripts/**
      - package.json
      - package-lock.json
      - capacitor.config.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build checks exercise the existing review backend. This is not approval
  # of a permanent production origin or a signed store submission.
  SALT_NATIVE_API_ORIGIN: https://partner-app-review--simply-salt-partner-demo.netlify.app

jobs:
  android:
    name: Android release compilation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci
      - run: npm test
      - run: npm run native:sync
      - name: Compile Android App Bundle and test APK
        working-directory: android
        run: bash gradlew --no-daemon bundleRelease assembleDebug lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-release-and-debug
          retention-days: 14
          if-no-files-found: error
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-release.html
      - name: Enable emulator acceleration in the temporary runner
        run: test -w /dev/kvm || sudo chmod a+rw /dev/kvm
      - name: Launch the installed Android app
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 420
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.simplysalt.partners/.MainActivity
            sleep 12
            adb shell pidof com.simplysalt.partners
            adb exec-out screencap -p > android-first-launch.png
            adb logcat -d -s Capacitor:V AndroidRuntime:E > android-first-launch.log
            if grep -q 'JavaScript Error:' android-first-launch.log; then cat android-first-launch.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-launch-evidence
          retention-days: 14
          path: |
            android-first-launch.png
            android-first-launch.log

  ios:
    name: iOS release compilation
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Select Xcode 26
        run: |
          for candidate in /Applications/Xcode_26*.app; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          xcodebuild -version | head -n 1 | grep -E 'Xcode (2[6-9]|[3-9][0-9])\.'
      - run: npm ci
      - run: npm run native:sync
      - name: Compile unsigned iOS archive
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SaltPartners.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive > "$RUNNER_TEMP/ios-build.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/ios-build.log"
              exit 1
            }
      - name: Package unsigned archive
        run: ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/SaltPartners.xcarchive" "$RUNNER_TEMP/SaltPartners-unsigned.xcarchive.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-unsigned-archive-and-log
          retention-days: 14
          path: |
            ${{ runner.temp }}/SaltPartners-unsigned.xcarchive.zip
            ${{ runner.temp }}/ios-build.log
      - name: Build and launch the iPhone simulator app
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-simulator" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/ios-simulator-build.log" 2>&1 || {
              tail -n 100 "$RUNNER_TEMP/ios-simulator-build.log"
              exit 1
            }
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); matches=[d["udid"] for runtime,devices in data["devices"].items() if ".iOS-" in runtime for d in devices if d.get("isAvailable") and d["name"].startswith("iPhone")]; print(matches[0] if matches else "")')"
          test -n "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$RUNNER_TEMP/ios-simulator/Build/Products/Release-iphonesimulator/App.app"
          xcrun simctl launch "$DEVICE_ID" com.simplysalt.partners
          sleep 12
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/ios-first-launch.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-native-launch-evidence
          retention-days: 14
          path: |
            ${{ runner.temp }}/ios-first-launch.png
            ${{ runner.temp }}/ios-simulator-build.log
