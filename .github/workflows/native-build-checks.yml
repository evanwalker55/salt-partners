name: Native build checks

on:
  push:
    branches: [codex/partner-launch-readiness]
    paths:
      - .github/workflows/native-build-checks.yml
      - android/**
      - ios/**
      - public/**
      - scripts/**
      - package.json
      - package-lock.json
      - capacitor.config.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build checks exercise the existing review backend. This is not approval
  # of a permanent production origin or a signed store submission.
  SALT_NATIVE_API_ORIGIN: https://partner-app-review--simply-salt-partner-demo.netlify.app

jobs:
  android:
    name: Android release compilation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npm run native:sync
      - name: Compile Android App Bundle and test APK
        working-directory: android
        run: bash gradlew --no-daemon bundleRelease assembleDebug lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-release-and-debug
          retention-days: 14
          if-no-files-found: error
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-release.html

  ios:
    name: iOS release compilation
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Select Xcode 26
        run: |
          for candidate in /Applications/Xcode_26*.app; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          xcodebuild -version | head -n 1 | grep -E 'Xcode (2[6-9]|[3-9][0-9])\.'
      - run: npm ci
      - run: npm run native:sync
      - name: Compile unsigned iOS archive
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SaltPartners.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive > "$RUNNER_TEMP/ios-build.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/ios-build.log"
              exit 1
            }
      - name: Package unsigned archive
        run: ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/SaltPartners.xcarchive" "$RUNNER_TEMP/SaltPartners-unsigned.xcarchive.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-unsigned-archive-and-log
          retention-days: 14
          path: |
            ${{ runner.temp }}/SaltPartners-unsigned.xcarchive.zip
            ${{ runner.temp }}/ios-build.log
