name: Native build checks

on:
  push:
    branches: [codex/partner-launch-readiness]
    paths:
      - .github/workflows/native-build-checks.yml
      - android/**
      - ios/**
      - public/**
      - scripts/**
      - tests/**
      - package.json
      - package-lock.json
      - capacitor.config.json
  workflow_dispatch:
    inputs:
      ios_store_upload:
        description: Build, sign, validate, and upload the current iOS candidate to App Store Connect
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-build-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use the stable deployed backend. Live booking remains paused separately.
  # A passing build does not authorize store submission.
  SALT_NATIVE_API_ORIGIN: https://simply-salt-partner-demo.netlify.app

jobs:
  android:
    name: Android release compilation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci
      - run: npm test
      - run: npm run native:sync
      - name: Compile Android App Bundle and test APK
        working-directory: android
        run: bash gradlew --no-daemon :app:bundleRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-release-and-debug
          retention-days: 14
          if-no-files-found: error
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-release.html
      - name: Enable emulator acceleration in the temporary runner
        run: test -w /dev/kvm || sudo chmod a+rw /dev/kvm
      - name: Launch the installed Android app
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 420
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.simplysalt.partners/.MainActivity
            sleep 12
            adb shell pidof com.simplysalt.partners
            adb exec-out screencap -p > android-first-launch.png
            adb logcat -d -s Capacitor:V AndroidRuntime:E > android-first-launch.log
            if grep -q 'JavaScript Error:' android-first-launch.log; then cat android-first-launch.log; exit 1; fi
            bash android/gradlew --no-daemon -p android :app:connectedDebugAndroidTest
            test "$(find android/app/build/outputs/connected_android_test_additional_output -name '*.png' | wc -l)" -eq 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-launch-evidence
          retention-days: 14
          path: |
            android-first-launch.png
            android-first-launch.log
            android/app/build/outputs/connected_android_test_additional_output/
            android/app/build/reports/androidTests/

  ios:
    name: iOS release compilation
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Select Xcode 26
        run: |
          for candidate in /Applications/Xcode_26*.app; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          xcodebuild -version | head -n 1 | grep -E 'Xcode (2[6-9]|[3-9][0-9])\.'
      - run: npm ci
      - run: npm run native:sync
      - name: Compile unsigned iOS archive
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SaltPartners.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive > "$RUNNER_TEMP/ios-build.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/ios-build.log"
              exit 1
            }
      - name: Package unsigned archive
        run: ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/SaltPartners.xcarchive" "$RUNNER_TEMP/SaltPartners-unsigned.xcarchive.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-unsigned-archive-and-log
          retention-days: 14
          path: |
            ${{ runner.temp }}/SaltPartners-unsigned.xcarchive.zip
            ${{ runner.temp }}/ios-build.log
      - name: Build and launch the iPhone simulator app
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-simulator" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/ios-simulator-build.log" 2>&1 || {
              tail -n 100 "$RUNNER_TEMP/ios-simulator-build.log"
              exit 1
            }
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); matches=[d["udid"] for runtime,devices in data["devices"].items() if ".iOS-" in runtime for d in devices if d.get("isAvailable") and d["name"].startswith("iPhone")]; print(matches[0] if matches else "")')"
          test -n "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$RUNNER_TEMP/ios-simulator/Build/Products/Release-iphonesimulator/App.app"
          xcrun simctl launch "$DEVICE_ID" com.simplysalt.partners
          sleep 12
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/ios-first-launch.png"
          xcrun simctl shutdown "$DEVICE_ID"
          IPAD_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); matches=[d["udid"] for runtime,devices in data["devices"].items() if ".iOS-" in runtime for d in devices if d.get("isAvailable") and d["name"].startswith("iPad") and "13" in d["name"]]; print(matches[0] if matches else "")')"
          test -n "$IPAD_ID"
          xcrun simctl boot "$IPAD_ID"
          xcrun simctl bootstatus "$IPAD_ID" -b
          xcrun simctl install "$IPAD_ID" "$RUNNER_TEMP/ios-simulator/Build/Products/Release-iphonesimulator/App.app"
          xcrun simctl launch "$IPAD_ID" com.simplysalt.partners
          sleep 12
          xcrun simctl io "$IPAD_ID" screenshot "$RUNNER_TEMP/ipad-first-launch.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-native-launch-evidence
          retention-days: 14
          path: |
            ${{ runner.temp }}/ios-first-launch.png
            ${{ runner.temp }}/ipad-first-launch.png
            ${{ runner.temp }}/ios-simulator-build.log

  ios-store:
    name: Sign and upload iOS candidate
    if: github.event_name == 'workflow_dispatch' && inputs.ios_store_upload
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ea1f8f0e2f0e9cbfb6a8be9c692a50807b61116e
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check signing inputs
        env:
          P12: ${{ secrets.SALT_IOS_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.SALT_IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.SALT_IOS_PROVISIONING_PROFILE }}
          API_KEY: ${{ secrets.SALT_APP_STORE_CONNECT_KEY }}
          API_KEY_ID: ${{ secrets.SALT_APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER: ${{ secrets.SALT_APP_STORE_CONNECT_ISSUER }}
        run: |
          set -euo pipefail
          for input in P12 P12_PASSWORD PROFILE API_KEY API_KEY_ID API_ISSUER; do
            test -n "${!input}" || { echo "Missing release secret: $input"; exit 1; }
          done
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          for candidate in /Applications/Xcode_26*.app; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
      - run: npm ci
      - run: npm test
      - run: npm run native:sync
      - name: Import signing material and export app
        env:
          P12: ${{ secrets.SALT_IOS_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.SALT_IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.SALT_IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          umask 077
          SIGN_DIR="$RUNNER_TEMP/salt-signing"
          mkdir -p "$SIGN_DIR" "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$P12" | base64 --decode > "$SIGN_DIR/distribution.p12"
          printf '%s' "$PROFILE" | base64 --decode > "$SIGN_DIR/profile.mobileprovision"
          security cms -D -i "$SIGN_DIR/profile.mobileprovision" > "$SIGN_DIR/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$SIGN_DIR/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$SIGN_DIR/profile.plist")
          cp "$SIGN_DIR/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIGN_DIR/release.keychain-db"
          security set-keychain-settings -lut 21600 "$SIGN_DIR/release.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGN_DIR/release.keychain-db"
          security import "$SIGN_DIR/distribution.p12" -k "$SIGN_DIR/release.keychain-db" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$SIGN_DIR/release.keychain-db" > /dev/null
          security list-keychains -d user -s "$SIGN_DIR/release.keychain-db" "$HOME/Library/Keychains/login.keychain-db"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/SaltPartners-signed.xcarchive" DEVELOPMENT_TEAM=7A2A77UZMU CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" archive > "$RUNNER_TEMP/ios-signed-build.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/ios-signed-build.log"; exit 1; }
          python3 - "$PROFILE_NAME" "$SIGN_DIR/export.plist" <<'PY'
          import plistlib,sys
          data={'method':'app-store-connect','destination':'export','teamID':'7A2A77UZMU','signingStyle':'manual','signingCertificate':'Apple Distribution','provisioningProfiles':{'com.simplysalt.partners':sys.argv[1]},'manageAppVersionAndBuildNumber':False,'uploadSymbols':True}
          with open(sys.argv[2],'wb') as stream: plistlib.dump(data,stream)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SaltPartners-signed.xcarchive" -exportPath "$RUNNER_TEMP/salt-export" -exportOptionsPlist "$SIGN_DIR/export.plist" > "$RUNNER_TEMP/ios-export.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/ios-export.log"; exit 1; }
          codesign --verify --deep --strict "$RUNNER_TEMP/SaltPartners-signed.xcarchive/Products/Applications/App.app"
      - name: Validate and upload to App Store Connect
        env:
          API_KEY: ${{ secrets.SALT_APP_STORE_CONNECT_KEY }}
          API_KEY_ID: ${{ secrets.SALT_APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER: ${{ secrets.SALT_APP_STORE_CONNECT_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.private_keys"
          printf '%s' "$API_KEY" | base64 --decode > "$HOME/.private_keys/AuthKey_$API_KEY_ID.p8"
          IPA=$(find "$RUNNER_TEMP/salt-export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          xcrun altool --validate-app -f "$IPA" -t ios --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-signed-release-and-log
          retention-days: 14
          path: |
            ${{ runner.temp }}/salt-export/*.ipa
            ${{ runner.temp }}/ios-signed-build.log
            ${{ runner.temp }}/ios-export.log
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/salt-signing/release.keychain-db" || true
          rm -rf "$RUNNER_TEMP/salt-signing" "$HOME/.private_keys"
